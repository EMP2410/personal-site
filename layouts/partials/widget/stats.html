{{- /*
  Custom widget: headline academic metrics.
  Data source: data/stats.yaml
  */ -}}
{{- with hugo.Data.stats -}}<section class="widget stats">
    <div class="widget-icon">
        {{ partial "helper/icon" "chart-bar" }}
    </div>
    <h2 class="widget-title section-title">At a Glance</h2>

    <div class="widget--stats">
        {{ range . }}
            <div class="stat-cell">
                <div class="v">{{ .value }}</div>
                <div class="l">{{ .label }}</div>
            </div>
        {{ end }}
    </div>
</section>
{{- end -}}
