# ==============================================================
#  Yang REN — Personal Academic Homepage
#  Hugo + Theme Stack (github.com/CaiJimmy/hugo-theme-stack)
# ==============================================================

baseURL                = "https://emp2410.github.io/personal-site/"
defaultContentLanguage = "en"
title                  = "Yang REN"
paginate               = 6
enableRobotsTXT        = true
copyright              = "Yang REN"

[languages]
  [languages.en]
    locale = "en-us"

[module]
  [[module.imports]]
    path = "github.com/CaiJimmy/hugo-theme-stack"

[permalinks]
  blog = "/blog/:slug/"
  news = "/news/:slug/"
  page = "/:slug/"

[outputs]
  home    = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[taxonomies]
  category = "categories"
  tag      = "tags"

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 4
    ordered    = true
  [markup.highlight]
    noClasses  = false
    style      = "github"
    lineNos    = false
    codeFences = true

[related]
  includeNewer = true
  threshold    = 60
  toLower      = false
  [[related.indices]]
    name   = "tags"
    weight = 100
  [[related.indices]]
    name   = "categories"
    weight = 200

[params]
  mainSections       = ["blog", "news"]
  featuredImageField = "image"
  rssFullContent     = true

  # ---------- RSS 作者信息 ----------
  [params.author]
    email = "yangren@cityu.edu.hk"
    name  = "Yang REN"

  # ---------- 左侧栏 ----------
  [params.sidebar]
    subtitle = "Chair Professor, Department of Physics · City University of Hong Kong"
    [params.sidebar.avatar]
      local = true
      src   = "img/avatar.jpg"

  # ---------- 文章区 ----------
  [params.article]
    math = true
    toc  = true
    [params.article.license]
      enabled = false
      default = "© Yang REN"

  # ---------- 评论（暂未接入平台，保持关闭） ----------
  [params.comments]
    enabled  = false
    provider = "giscus"

  # ---------- 右侧栏组件（social / stats 为本站自定义） ----------
  [params.widgets]
    enabled = ["social", "stats", "search", "archives", "tag-cloud"]
    [params.widgets.archives]
      limit = 6
    [params.widgets.tagCloud]
      limit = 12

  # ---------- 明暗模式 ----------
  [params.colorScheme]
    toggle = true
    default = "auto"

  [params.footer]
    since = 2021
    customText = "Built with Hugo · Theme Stack"

  [params.opengraph]
    [params.opengraph.twitter]
      site = ""
      card = "summary_large_image"

  [params.defaultImage]
    [params.defaultImage.opengraph]
      enabled = false
      local   = false
      src     = ""

  [params.imageProcessing]
    [params.imageProcessing.cover]
      enabled = true
    [params.imageProcessing.content]
      enabled = true

# ==============================================================
#  主菜单
# ==============================================================
[menus]
  [[menus.main]]
    identifier = "home"
    name       = "Home"
    url        = "/"
    weight     = -100
    pre        = "home"

  [[menus.main]]
    identifier = "about"
    name       = "About"
    url        = "/about/"
    weight     = -90
    pre        = "user"

  [[menus.main]]
    identifier = "cv"
    name       = "CV"
    url        = "/cv/"
    weight     = -85
    pre        = "file-text"

  [[menus.main]]
    identifier = "blog"
    name       = "Blog"
    url        = "/blog/"
    weight     = -80
    pre        = "pencil"

  [[menus.main]]
    identifier = "news"
    name       = "News"
    url        = "/news/"
    weight     = -75
    pre        = "bell"

  [[menus.main]]
    identifier = "gallery"
    name       = "Gallery"
    url        = "/gallery/"
    weight     = -70
    pre        = "photo"